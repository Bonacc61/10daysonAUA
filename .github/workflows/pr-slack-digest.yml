name: Slack digest

# Posts one short, plain-English note to Slack for every change that actually
# lands on main, saying what is different for someone using the site.
#
# Only `push` to main. That is deliberate and it is what keeps this to one
# message per change:
#
#   - A merged pull request IS a push to main, so merges are covered.
#   - Subscribing to pull_request as well announced everything twice, once on
#     open and again on merge, which is what this replaced.
#   - It also deleted the merge-detection heuristic that used to suppress the
#     duplicate. That heuristic silently dropped any hand-written commit whose
#     message ended in "(#12)". No duplicate to suppress, no heuristic, no
#     silently missing commits.
#
# The cost, stated plainly: work in an open pull request is invisible until it
# merges. Proposing a change announces nothing. That is the trade for one
# message per landed change rather than three.
#
# The prompt aims at one thing: a note a non-engineer reads in ten seconds and
# learns something real from. It answers "what is different now" and stops.
# Notes about internal plumbing get one sentence saying so — the reader does not
# need bullets about a change they will never see.
#
# It began as the `deconstruct` skill, which says to define every term of art at
# first use. Right for a decision document, wrong here: it adds a clause per
# term and the notes came out at 250 words nobody finished. Inverted — avoid the
# term so there is nothing to define. "Makes search faster" beats "adds an index
# — a lookup table that lets the database skip rows".
#
# Uses the Claude Code CLI rather than anthropics/claude-code-action, because
# that action rejects push outright — "Unsupported event type: push" — which
# silently broke every direct commit to main. The CLI has no event restriction
# and takes the same subscription token. `claude -p` prints the note on stdout,
# so there is no intermediate file and no Write tool to grant.
#
# The summary step never fails the job. Anything that goes wrong falls through
# to the Slack step, which posts the link and says the summary is missing.
# Silence is the worst outcome available: it is indistinguishable from "nothing
# happened", so a broken digest hides indefinitely. It already did once.
#
# Secrets required:
#   CLAUDE_CODE_OAUTH_TOKEN  — from `claude setup-token`, billed to the Claude
#                              subscription rather than API credit
#   SLACK_BOT_TOKEN          — the Slack app's xoxb- token (needs chat:write; the
#                              app has no chat:write.public, so the bot must be a
#                              member of the target channel or posting fails)

on:
  push:
    branches: [main]

# Keyed on the commit: two pushes in quick succession are two things to
# announce, so neither may cancel the other.
concurrency:
  group: slack-digest-${{ github.sha }}
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history: the commit range below is meaningless on a shallow
          # clone, and `git diff BEFORE..AFTER` fails outright.
          fetch-depth: 0

      - name: Work out what changed
        id: event
        env:
          # Held in env rather than inlined into the script, so a commit message
          # cannot execute as shell.
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
          COMPARE_URL: ${{ github.event.compare }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail

          out() { printf '%s<<__EOF__\n%s\n__EOF__\n' "$1" "$2" >> "$GITHUB_OUTPUT"; }

          # A range is only usable if both ends exist locally. Force-pushes leave
          # BEFORE dangling or all-zeroes, so fall back to the head commit alone.
          # Last resort is git's empty-tree hash, a real object in every
          # repository meaning "no files at all" — diffing against it renders the
          # commit as pure additions, which covers a commit with no parent.
          EMPTY_TREE=4b825dc642cb6eb9a060e54bf8d69288fbee4904
          if git rev-list --count "$BEFORE..$AFTER" >/dev/null 2>&1; then
            RANGE="$BEFORE..$AFTER"
          elif git rev-parse --verify --quiet "$AFTER~1" >/dev/null; then
            RANGE="$AFTER~1..$AFTER"
          else
            RANGE="$EMPTY_TREE..$AFTER"
          fi

          COUNT="$(git rev-list --count "$RANGE")"
          FIRST_LINE="$(printf '%s' "$HEAD_MSG" | head -n 1)"

          if [ "$COUNT" -le 1 ]; then
            HEADER="$FIRST_LINE"
          else
            HEADER="${COUNT} changes — ${FIRST_LINE}"
          fi

          out "header" "$HEADER"
          out "url" "$COMPARE_URL"
          out "meta" "by ${ACTOR}"
          out "range" "$RANGE"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Write the note
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RANGE: ${{ steps.event.outputs.range }}
        # No `set -e`. Every failure below must fall through to the Slack step,
        # which posts a fallback — silence is the one outcome worse than a bad
        # note, because it looks exactly like nothing having happened.
        run: |
          set -uo pipefail

          npm install -g @anthropic-ai/claude-code >/dev/null 2>&1 || true

          # The range is printed from env; the rules are a quoted heredoc so
          # nothing in them expands.
          {
          printf 'Code just landed on the main branch of this repository. Inspect it with `git log --oneline %s` and `git diff %s`, and read any source file you need in order to judge what it actually does.\n\n' "$RANGE" "$RANGE"
          cat <<'RULES'
          Then answer one question, for someone who uses this site but does not
          write code and has thirty seconds:

              What is different now?

          Rules, in priority order:

          - Lead with what changed for a person using the site. Not what changed
            in the code — what they would notice, or what now works that did not.
          - If nothing user-visible changed, say in ONE sentence what internal
            thing changed and stop there. No bullets. No closing line. A note
            about plumbing does not deserve a paragraph.
          - Under 50 words. Two sentences is usually right, one is often enough.
          - Never name files, functions, libraries, tools or technologies.
          - Never restate the commit message. The reader can already see it.
          - Never write a sentence whose only content is that there is nothing to
            say. No "nothing to watch out for", no "no risk", no "routine", no
            "no user-facing changes" as a closing flourish. If there is nothing
            more to add, the note simply ends.
          - Only if a person could actually hit a problem, one final line
            starting "Watch out:" naming what breaks and when. Most changes do
            not get this line.

          Two notes at the right length and register:

            Beaches now show the verified map pins, so directions stop sending
            people to the wrong side of the island.

            Nothing changes on the site — this only fixes the Slack notifications
            the team gets.

          Format: plain text, Slack mrkdwn — *bold* not **bold**, no headers. No
          preamble, no sign-off, no restating these instructions. Your entire
          reply is the note, and gets posted verbatim.
          RULES
          } > "$RUNNER_TEMP/prompt.md"

          # `claude -p` prints the note on stdout — that IS the summary, so there
          # is no file for the model to write and no Write tool to grant.
          claude -p "$(cat "$RUNNER_TEMP/prompt.md")" \
            --allowedTools "Read,Bash" \
            --permission-mode bypassPermissions \
            > note.txt 2> "$RUNNER_TEMP/claude-err.log" || true

          if [ -s note.txt ]; then
            echo "--- note ---"
            cat note.txt
          else
            echo "::warning::Claude produced no note; the fallback will post."
            tail -n 20 "$RUNNER_TEMP/claude-err.log" || true
          fi

      - name: Post it to Slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          CHANNEL: C0BPNKA6Y1L
          HEADER: ${{ steps.event.outputs.header }}
          META: ${{ steps.event.outputs.meta }}
          URL: ${{ steps.event.outputs.url }}
        run: |
          set -euo pipefail

          # If Claude failed or wrote nothing, still post. Silence would read as
          # "nothing happened", which is worse than a bare link.
          if [ -s note.txt ]; then
            NOTE="$(cat note.txt)"
          else
            NOTE="_(No summary was generated — see the link above.)_"
          fi

          # jq -n --arg builds the JSON, so nothing in the commit message or the
          # note can break out of the payload.
          PAYLOAD="$(jq -n \
            --arg channel "$CHANNEL" \
            --arg header "$HEADER" \
            --arg meta "$META" \
            --arg note "$NOTE" \
            --arg url "$URL" \
            '{
              channel: $channel,
              unfurl_links: false,
              text: $header,
              blocks: [
                { type: "section",
                  text: { type: "mrkdwn", text: ("*<" + $url + "|" + $header + ">*  " + $meta) } },
                { type: "section",
                  text: { type: "mrkdwn", text: $note } }
              ]
            }')"

          RESPONSE="$(curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            -H 'Content-type: application/json; charset=utf-8' \
            --data "$PAYLOAD")"

          # Slack answers 200 with {"ok":false,"error":"..."} on failure, so the
          # curl exit code proves nothing. Check the body or this fails silently
          # forever.
          if [ "$(printf '%s' "$RESPONSE" | jq -r '.ok')" != "true" ]; then
            echo "::error::Slack rejected the message: $(printf '%s' "$RESPONSE" | jq -r '.error')"
            echo "not_in_channel    -> invite the bot to the target channel"
            echo "invalid_auth      -> SLACK_BOT_TOKEN is wrong or was rotated"
            echo "channel_not_found -> wrong channel ID, or the bot cannot see it"
            exit 1
          fi

          echo "Posted: ${HEADER}"
