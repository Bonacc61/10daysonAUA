name: PR Slack digest

# Posts a written summary of every change to Slack, so the state of the repo is
# legible without opening GitHub.
#
# Not a notification bot. GitHub's own Slack app already posts event cards and
# they are close to useless — "Bonacc61 opened #12" tells you nothing you would
# act on. This reads the actual diff and says what changed and whether it looks
# risky.
#
# Covers two things, with no overlap between them:
#   pull_request  — opened, ready for review, new commits, merged/closed
#   push to main  — commits that never went through a PR
#
# The no-overlap part is load-bearing. Merging a PR fires BOTH a pull_request
# `closed` event and a `push` to main, which would announce every merge twice.
# The push branch bails out when the head commit looks merge-produced — GitHub
# squashes as "Title (#12)" and merge-commits as "Merge pull request #12".
# The cost of that heuristic: a hand-written commit ending in "(#12)" is
# silently skipped. Judged worth it against doubling every merge.
#
# `synchronize` (commits pushed to an open PR) summarises ONLY the new commits,
# not the whole PR again — otherwise every push re-announces the entire branch.
#
# The prompt aims at one thing: a note a non-engineer reads in ten seconds.
#
# It started from the `deconstruct` skill, which says to define every term of art
# at first use. That rule is right for a decision document and wrong here — it
# adds a clause per term, and the digests came out at 250 words nobody finished.
# Inverted instead: avoid the term, so there is nothing to define. "Makes search
# faster" beats "adds an index — a lookup table that lets the database skip
# rows". What survives from the skill is naming a concrete failure rather than a
# category, and refusing to pad.
#
# The worked example in the prompt is doing real work. Length and register are
# far better controlled by showing one than by asking for a word count.
#
# Claude writes the prose; a plain shell step delivers it. Keeping delivery out
# of the model's hands means diff text containing quotes, backticks or newlines
# cannot break the Slack payload — jq handles the escaping.
#
# Uses the Claude Code CLI rather than anthropics/claude-code-action, because
# that action rejects `push` outright — "Unsupported event type: push" — and the
# push path is half the point of this workflow. The CLI has no such restriction
# and takes the same subscription token, so one mechanism now covers both
# triggers. `claude -p` prints the note on stdout, which removes the file the
# model used to write and the Write tool it needed to do it.
#
# The summary step deliberately never fails the job. Anything that goes wrong
# falls through to the Slack step, which posts the link with a note that the
# summary is missing. Silence is the worst outcome available here: it is
# indistinguishable from "no commits happened", so a failure that silences the
# channel gets discovered weeks later, if ever.
#
# Secrets required:
#   CLAUDE_CODE_OAUTH_TOKEN  — from `claude setup-token`, billed to the Claude
#                              subscription rather than API credit
#   SLACK_BOT_TOKEN          — the Slack app's xoxb- token (needs chat:write; the
#                              app has no chat:write.public, so the bot must be a
#                              member of the target channel or posting fails)
#
# Note: pull_request runs from forks do not receive secrets, by GitHub design.
# Fork PRs will silently not post. Fine while this is a solo repo; revisit with
# pull_request_target (carefully) if that changes.

on:
  pull_request:
    types: [opened, ready_for_review, synchronize, closed]
  push:
    branches: [main]

# Keyed on the commit, not the PR: two pushes in quick succession are two
# distinct things to announce, so neither may cancel the other.
concurrency:
  group: pr-slack-digest-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Drafts are not ready to be summarised; they get their digest when marked
    # ready for review instead. Push events carry no draft flag, hence the OR.
    if: github.event_name == 'push' || github.event.pull_request.draft == false

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history: the commit ranges below are meaningless on a shallow
          # clone, and `git diff BEFORE..AFTER` fails outright.
          fetch-depth: 0

      - name: Work out what changed
        id: event
        env:
          # Every field is held in env rather than inlined into the script, so a
          # branch or commit message cannot execute as shell.
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          MERGED: ${{ github.event.pull_request.merged }}
          PR_NUMBER: ${{ github.event.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
          COMPARE_URL: ${{ github.event.compare }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail

          out() { printf '%s<<__EOF__\n%s\n__EOF__\n' "$1" "$2" >> "$GITHUB_OUTPUT"; }

          # A range is only usable if both ends exist locally. Force-pushes and
          # first-pushes leave BEFORE dangling or all-zeroes, so fall back to the
          # head commit alone rather than failing the job.
          #
          # The last resort is git's empty-tree hash, which is a real object in
          # every repository representing "no files at all" — diffing against it
          # renders the commit as pure additions. It covers the case where the
          # head has no parent to fall back to, where `HEAD~1` would not resolve.
          EMPTY_TREE=4b825dc642cb6eb9a060e54bf8d69288fbee4904
          safe_range() {
            if git rev-list --count "$1..$2" >/dev/null 2>&1; then
              printf '%s..%s' "$1" "$2"
            elif git rev-parse --verify --quiet "$2~1" >/dev/null; then
              printf '%s~1..%s' "$2" "$2"
            else
              printf '%s..%s' "$EMPTY_TREE" "$2"
            fi
          }

          if [ "$EVENT" = "push" ]; then
            FIRST_LINE="$(printf '%s' "$HEAD_MSG" | head -n 1)"
            if printf '%s' "$FIRST_LINE" | grep -qE '\(#[0-9]+\)$|^Merge pull request #[0-9]+'; then
              echo "The pull_request closed event already announced this merge."
              out "skip" "true"
              exit 0
            fi

            RANGE="$(safe_range "$BEFORE" "$AFTER")"
            COUNT="$(git rev-list --count "$RANGE")"
            [ "$COUNT" = "1" ] && NOUN="commit" || NOUN="commits"

            out "skip" "false"
            out "header" "$FIRST_LINE"
            out "url" "$COMPARE_URL"
            out "meta" "*${COUNT} ${NOUN} pushed to main* by ${ACTOR}"
            out "brief" "${COUNT} ${NOUN} were just pushed directly to the main branch, without going through a pull request."
            out "inspect" "\`git log --oneline ${RANGE}\` and \`git diff ${RANGE}\`"

          elif [ "$ACTION" = "synchronize" ]; then
            RANGE="$(safe_range "$BEFORE" "$AFTER")"
            COUNT="$(git rev-list --count "$RANGE")"
            [ "$COUNT" = "1" ] && NOUN="commit" || NOUN="commits"

            out "skip" "false"
            out "header" "#${PR_NUMBER} ${PR_TITLE}"
            out "url" "$PR_URL"
            out "meta" "*${COUNT} new ${NOUN}* by ${ACTOR}"
            out "brief" "${COUNT} new ${NOUN} were just pushed to open pull request #${PR_NUMBER}."
            out "inspect" "\`git log --oneline ${RANGE}\` and \`git diff ${RANGE}\` — summarise ONLY these new commits, not the whole pull request"

          else
            if [ "$ACTION" = "closed" ] && [ "$MERGED" = "true" ]; then
              HEADLINE="merged"
            elif [ "$ACTION" = "closed" ]; then
              HEADLINE="closed without merging"
            elif [ "$ACTION" = "ready_for_review" ]; then
              HEADLINE="ready for review"
            else
              HEADLINE="opened"
            fi

            out "skip" "false"
            out "header" "#${PR_NUMBER} ${PR_TITLE}"
            out "url" "$PR_URL"
            out "meta" "*${HEADLINE}* by ${PR_AUTHOR}"
            out "brief" "Pull request #${PR_NUMBER} in this repository was just ${HEADLINE}."
            out "inspect" "\`gh pr view ${PR_NUMBER}\` and \`gh pr diff ${PR_NUMBER}\`"
          fi

      - name: Set up Node
        if: steps.event.outputs.skip != 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Write the summary
        if: steps.event.outputs.skip != 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRIEF: ${{ steps.event.outputs.brief }}
          INSPECT: ${{ steps.event.outputs.inspect }}
        # No `set -e`. Every failure below must fall through to the Slack step,
        # which posts a fallback — silence is the one outcome worse than a bad
        # summary, and silence is indistinguishable from "nothing happened".
        run: |
          set -uo pipefail

          npm install -g @anthropic-ai/claude-code >/dev/null 2>&1 || true

          # The two dynamic lines are printed from env; the rules are a quoted
          # heredoc so nothing in them expands. A commit message cannot reach
          # the shell either way.
          {
          printf '%s\n\n' "$BRIEF"
          printf 'Inspect it with %s. Read any source file you need in order to judge what the change actually does.\n\n' "$INSPECT"
          cat <<'RULES'
          Then write a very short note for someone who does not write code and
          wants to know what happened, and nothing more.

          Hard rules:

          - Under 80 words. Shorter is always better. Most changes deserve two
            sentences. A typo fix deserves one line.
          - Avoid the jargon instead of explaining it. Do not name files,
            functions, libraries, or technologies unless the note is meaningless
            without them. Say what the change does for a person, not how it is
            built. Write "Slack now gets a message when code goes straight into
            the project" — never "adds a push trigger to the workflow".
          - No line counts, no file paths, no percentages, unless that number is
            the entire point of the change.
          - Never restate the title. The reader can already see it.

          Shape:

          - One plain sentence: what changed, and why anyone should care.
          - Then at most three short bullets, and only if they say something the
            sentence did not. Fewer is better. For a small change, drop them.
          - Only if something could genuinely go wrong for a person, one final
            line starting `Watch out:`. Otherwise leave it out — never write "no
            risk", "routine", or any other placeholder.

          This is the right length and register:

            Jarvis now speaks up when code goes straight into the project, not
            only when changes are proposed for review first.

            • Announces new code added to an open proposal
            • Stays quiet instead of repeating itself when one is approved

            Watch out: a note ending in something like "(#4)" is mistaken for an
            approval and stays silent.

          Format: plain text, Slack mrkdwn — *bold* not **bold**, no headers. No
          preamble, no sign-off, no restating these instructions. Your entire
          reply is the note, and gets posted verbatim.
          RULES
          } > "$RUNNER_TEMP/prompt.md"

          # `claude -p` prints the note on stdout — that IS the summary, so there
          # is no file for the model to write and no Write tool to grant.
          claude -p "$(cat "$RUNNER_TEMP/prompt.md")" \
            --allowedTools "Read,Bash" \
            --permission-mode bypassPermissions \
            > pr-summary.txt 2> "$RUNNER_TEMP/claude-err.log" || true

          if [ -s pr-summary.txt ]; then
            echo "--- summary ---"
            cat pr-summary.txt
          else
            echo "::warning::Claude produced no summary; the fallback will post."
            tail -n 20 "$RUNNER_TEMP/claude-err.log" || true
          fi

      - name: Post it to Slack
        if: steps.event.outputs.skip != 'true'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          CHANNEL: C0BPNKA6Y1L
          HEADER: ${{ steps.event.outputs.header }}
          META: ${{ steps.event.outputs.meta }}
          URL: ${{ steps.event.outputs.url }}
        run: |
          set -euo pipefail

          # If Claude failed or wrote nothing, still post. Silence would read as
          # "nothing happened", which is worse than a bare link.
          if [ -s pr-summary.txt ]; then
            SUMMARY="$(cat pr-summary.txt)"
          else
            SUMMARY="_(No summary was generated — see the link above.)_"
          fi

          # jq -n --arg builds the JSON, so nothing in the title or summary can
          # break out of the payload.
          PAYLOAD="$(jq -n \
            --arg channel "$CHANNEL" \
            --arg header "$HEADER" \
            --arg meta "$META" \
            --arg summary "$SUMMARY" \
            --arg url "$URL" \
            '{
              channel: $channel,
              unfurl_links: false,
              text: $header,
              blocks: [
                { type: "section",
                  text: { type: "mrkdwn", text: ("*<" + $url + "|" + $header + ">*\n" + $meta) } },
                { type: "section",
                  text: { type: "mrkdwn", text: $summary } }
              ]
            }')"

          RESPONSE="$(curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            -H 'Content-type: application/json; charset=utf-8' \
            --data "$PAYLOAD")"

          # Slack answers 200 with {"ok":false,"error":"..."} on failure, so the
          # curl exit code proves nothing. Check the body or this fails silently
          # forever.
          if [ "$(printf '%s' "$RESPONSE" | jq -r '.ok')" != "true" ]; then
            echo "::error::Slack rejected the message: $(printf '%s' "$RESPONSE" | jq -r '.error')"
            echo "not_in_channel    -> invite the bot to the target channel"
            echo "invalid_auth      -> SLACK_BOT_TOKEN is wrong or was rotated"
            echo "channel_not_found -> wrong channel ID, or the bot cannot see it"
            exit 1
          fi

          echo "Posted digest: ${HEADER}"
