name: PR Slack digest

# Posts a written summary of each pull request to Slack, so the state of the
# repo is legible without opening GitHub.
#
# Not a notification bot. GitHub's own Slack app already posts event cards and
# they are close to useless — "Bonacc61 opened #12" tells you nothing you would
# act on. This reads the actual diff and says what changed and whether it looks
# risky.
#
# The writing rules in the prompt are the `deconstruct` skill — jargon defined at
# first use with its stake, real numbers over adjectives, risk as a concrete
# failure. They are inlined rather than referenced because that skill lives in a
# personal ~/.claude and does not exist on a GitHub runner; naming it here would
# silently do nothing. Its option-comparison structure is deliberately dropped:
# a PR is not a choice between alternatives.
#
# Fires on the pull_request event itself, so there is no polling and nothing to
# host. Deliberately NOT subscribed to `synchronize` (every commit pushed to an
# open PR): that is the difference between a channel you read and a channel you
# mute.
#
# Claude writes the prose; a plain shell step delivers it. Keeping delivery out
# of the model's hands means diff text containing quotes, backticks or newlines
# cannot break the Slack payload — jq handles the escaping.
#
# Secrets required:
#   CLAUDE_CODE_OAUTH_TOKEN  — from `claude setup-token`, billed to the Claude
#                              subscription rather than API credit
#   SLACK_BOT_TOKEN          — the @Jan app's xoxb- token (needs chat:write; the
#                              app has no chat:write.public, so @Jan must be a
#                              member of the target channel or posting fails)
#
# Note: pull_request runs from forks do not receive secrets, by GitHub design.
# Fork PRs will silently not post. Fine while this is a solo repo; revisit with
# pull_request_target (carefully) if that changes.

on:
  pull_request:
    types: [opened, ready_for_review, closed]

# One digest per PR event. A doubled post is noise, and two runs racing on the
# same PR would both post.
concurrency:
  group: pr-slack-digest-${{ github.event.number }}-${{ github.event.action }}
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Drafts are not ready to be summarised; they get their digest when marked
    # ready for review instead.
    if: github.event.pull_request.draft == false

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Describe what happened to this PR
        id: event
        env:
          ACTION: ${{ github.event.action }}
          MERGED: ${{ github.event.pull_request.merged }}
        run: |
          # Held in env rather than inlined into the script, so a PR titled
          # `"; rm -rf / #` is data and not code.
          if [ "$ACTION" = "closed" ] && [ "$MERGED" = "true" ]; then
            echo "headline=merged" >> "$GITHUB_OUTPUT"
          elif [ "$ACTION" = "closed" ]; then
            echo "headline=closed without merging" >> "$GITHUB_OUTPUT"
          elif [ "$ACTION" = "ready_for_review" ]; then
            echo "headline=ready for review" >> "$GITHUB_OUTPUT"
          else
            echo "headline=opened" >> "$GITHUB_OUTPUT"
          fi

      - name: Write the summary
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --max-turns 12
            --allowedTools Read,Write,Bash
          prompt: |
            Pull request #${{ github.event.number }} in this repository was just
            ${{ steps.event.outputs.headline }}.

            Read it with `gh pr view ${{ github.event.number }}` and
            `gh pr diff ${{ github.event.number }}`. Read any source file you
            need in order to judge what the change actually does.

            Then write a summary for a teammate who has not read the code and
            will not open the PR unless you give them a reason to. Write it to
            the file `pr-summary.txt` in the repository root.

            Write it so someone can follow it without sharing your vocabulary:

            - *Lead with the load-bearing idea.* Open with the single concept the
              change rests on, in plain words. If the reader understands only
              that first line, the bullets should already half make sense. Never
              restate the PR title.
            - *Define every term of art at first use*, in the same sentence, in
              words a smart non-specialist knows — and give the stake, not just
              the definition. "an index lets the database skip most of the rows,
              which is what keeps this fast as the catalog grows", not "adds an
              index". Terms of art include library and product names, and
              ordinary words carrying a specialist meaning: migration, hook,
              bundle, payload, edge function, cold start, index.
            - *Use the real numbers from the diff* — files touched, lines added
              and removed, values that actually changed. Measurements decide
              things; adjectives do not. Write "grows the bundle 12 KB", never
              "may affect performance". If you did not measure it, say so.
            - *Say what it costs, not only what it buys.* The reader cannot agree
              with a change they cannot disagree with.
            - Then a short bullet list of the substantive changes, grouped by
              intent rather than by file. Skip lockfiles, formatting and
              generated code.
            - Close with `Risk:` naming a *concrete failure* — who breaks, doing
              what, when. "Deleting the auth test means a broken login ships
              silently", not "touches authentication". If genuinely routine,
              write `Risk: routine.` and nothing more. Never invent a concern to
              seem thorough.
            - If something could not be settled from the diff alone, add a final
              line starting `Unverified:` saying what you would need to check.
              Omit the line entirely when nothing is in doubt.

            Format: plain text, Slack mrkdwn — *bold* not **bold**, no headers.
            Under 250 words. No preamble, no sign-off, no restating these
            instructions. The file's entire contents get posted verbatim.

      - name: Post it to Slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          CHANNEL: C0BPNKA6Y1L
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEADLINE: ${{ steps.event.outputs.headline }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -euo pipefail

          # If Claude failed or wrote nothing, still post. Silence would read as
          # "no PRs happened", which is worse than a bare link.
          if [ -s pr-summary.txt ]; then
            SUMMARY="$(cat pr-summary.txt)"
          else
            SUMMARY="_(No summary was generated — see the PR.)_"
          fi

          # jq -n --arg builds the JSON, so nothing in the title or summary can
          # break out of the payload.
          PAYLOAD="$(jq -n \
            --arg channel "$CHANNEL" \
            --arg header "#${PR_NUMBER} ${PR_TITLE}" \
            --arg meta "*${HEADLINE}* by ${PR_AUTHOR}" \
            --arg summary "$SUMMARY" \
            --arg url "$PR_URL" \
            '{
              channel: $channel,
              unfurl_links: false,
              text: $header,
              blocks: [
                { type: "section",
                  text: { type: "mrkdwn", text: ("*<" + $url + "|" + $header + ">*\n" + $meta) } },
                { type: "section",
                  text: { type: "mrkdwn", text: $summary } }
              ]
            }')"

          RESPONSE="$(curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            -H 'Content-type: application/json; charset=utf-8' \
            --data "$PAYLOAD")"

          # Slack answers 200 with {"ok":false,"error":"..."} on failure, so the
          # curl exit code proves nothing. Check the body or this fails silently
          # forever.
          if [ "$(printf '%s' "$RESPONSE" | jq -r '.ok')" != "true" ]; then
            echo "::error::Slack rejected the message: $(printf '%s' "$RESPONSE" | jq -r '.error')"
            echo "not_in_channel  -> run /invite @Jan in the target channel"
            echo "invalid_auth    -> SLACK_BOT_TOKEN is wrong or was rotated"
            echo "channel_not_found -> wrong channel ID, or Jarvis cannot see it"
            exit 1
          fi

          echo "Posted digest for #${PR_NUMBER} (${HEADLINE})."
